# 웹사이트(홈 · 주간 스케줄 · 캘린더)를 GitHub Pages 로 올린다. 서버나 회사 PC 없이 동작한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # GitHub 공식 예시처럼 "파일 모으기"와 "올리기"를 두 단계로 나눈다 (한 단계로 하면 가끔 업로드한 파일을 못 찾음)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일 모으기
        run: |
          cp -r public _site
          mv _site/index.html _site/schedule.html
          cp _site/portal.html _site/index.html
          rm -f _site/login.html
          # 밴드 자동 입력 확장 프로그램 설치 파일
          (cd extension && zip -qr ../_site/sbe-band-extension.zip .)
          # 새 버전을 올렸을 때 브라우저가 예전 파일을 계속 쓰지 않도록 파일 주소 뒤에 버전 표시를 붙인다
          V=${GITHUB_SHA::7}
          sed -i -E "s#(src|href)=\"([^\":]+\.(js|css|svg))\"#\1=\"\2?v=$V\"#g" _site/*.html
          sed -i "s#logo.svg#logo.svg?v=$V#" _site/ws-common.js
          # 홈 바로가기의 두 번째 밴드 (공개 저장소라 밴드 주소는 Secret BAND2_URL 에만 둔다)
          if printf '%s' "$BAND2_URL" | grep -Eq '^https://(www\.)?band\.us/band/[0-9]+(/post)?$'; then
            printf '\nwindow.SB_BAND2_URL = "%s";\n' "$BAND2_URL" >> _site/band-config.js
          fi
        env:
          BAND2_URL: ${{ secrets.BAND2_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
