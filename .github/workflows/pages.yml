# 웹사이트(홈 · 주간 스케줄 · 캘린더)를 GitHub Pages 로 올린다. 서버나 회사 PC 없이 동작한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일 모으기
        run: |
          cp -r public _site
          mv _site/index.html _site/schedule.html
          cp _site/portal.html _site/index.html
          rm -f _site/login.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
