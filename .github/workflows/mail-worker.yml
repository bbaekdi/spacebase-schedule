# 네이버웍스 메일 중계 서버(worker/)를 Cloudflare Workers 에 올린다.
# 필요한 저장소 Secrets: CF_API_TOKEN, CF_ACCOUNT_ID (Cloudflare), NW_CLIENT_ID, NW_CLIENT_SECRET (네이버웍스 개발자 콘솔)
name: mail-worker
on:
  push:
    branches: [main]
    paths: ['worker/naverworks-mail.js', 'worker/wrangler.toml', '.github/workflows/mail-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      NW_CLIENT_ID: ${{ secrets.NW_CLIENT_ID }}
      NW_CLIENT_SECRET: ${{ secrets.NW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare 설정(CF_API_TOKEN, CF_ACCOUNT_ID)이 없어 건너뜁니다."; exit 0; fi
          npx --yes wrangler@3 deploy
          if [ -n "$NW_CLIENT_ID" ] && [ -n "$NW_CLIENT_SECRET" ]; then
            printf '%s' "$NW_CLIENT_ID" | npx --yes wrangler@3 secret put NW_CLIENT_ID
            printf '%s' "$NW_CLIENT_SECRET" | npx --yes wrangler@3 secret put NW_CLIENT_SECRET
          else
            echo "네이버웍스 설정(NW_CLIENT_ID, NW_CLIENT_SECRET)이 아직 없습니다."
          fi
