# 밴드 캘린더 중계(worker/band-relay.js)를 Cloudflare Workers 에 올린다.
# 필요한 저장소 Secrets: CF_API_TOKEN, CF_ACCOUNT_ID (Cloudflare), BAND_ICAL_URL, SB_CODE, (선택) GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
name: band-worker
on:
  push:
    branches: [main]
    paths: ['worker/band-relay.js', 'worker/google.js', 'worker/push.js', 'worker/band.toml', 'tools/vapid.mjs', '.github/workflows/band-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      BAND_ICAL_URL: ${{ secrets.BAND_ICAL_URL }}
      SB_CODE: ${{ secrets.SB_CODE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare 설정(CF_API_TOKEN, CF_ACCOUNT_ID)이 없어 건너뜁니다."; exit 0; fi
          npx --yes wrangler@3 deploy -c band.toml
          if [ -n "$BAND_ICAL_URL" ] && [ -n "$SB_CODE" ]; then
            printf '%s' "$BAND_ICAL_URL" | npx --yes wrangler@3 secret put BAND_ICAL_URL -c band.toml
            printf '%s' "$SB_CODE" | npx --yes wrangler@3 secret put SB_CODE -c band.toml
          else
            echo "BAND_ICAL_URL, SB_CODE 가 없습니다."
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx --yes wrangler@3 secret put GOOGLE_CLIENT_ID -c band.toml
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx --yes wrangler@3 secret put GOOGLE_CLIENT_SECRET -c band.toml
          else
            echo "구글 연결 설정(GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)이 아직 없습니다."
          fi
          # Band 새 글 알림 (worker/push.js): Firebase 관리 열쇠 + 그것으로 만든 알림 열쇠
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx --yes wrangler@3 secret put FIREBASE_SERVICE_ACCOUNT -c band.toml
            node ../tools/vapid.mjs private | npx --yes wrangler@3 secret put VAPID_PRIVATE -c band.toml
            node ../tools/vapid.mjs public | npx --yes wrangler@3 secret put VAPID_PUBLIC -c band.toml
          else
            echo "FIREBASE_SERVICE_ACCOUNT 가 없어 알림 설정을 건너뜁니다."
          fi
