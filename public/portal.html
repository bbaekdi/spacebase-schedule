<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>홈 · SPACEBASE</title>
<link rel="stylesheet" href="ws.css">
<style>
  .wrap.home { max-width: 1320px; }
  .card h2 { white-space: nowrap; }
  .home { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start; }
  .left { display: grid; gap: 14px; }
  .profile { padding: 22px 20px 16px; display: flex; flex-direction: column; min-height: 360px; }
  .profile .avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; background: #fff; }
  .profile .avatar img { width: 40px; }
  .profile h1 { margin: 18px 0 8px; font-size: 19px; line-height: 1.4; overflow-wrap: anywhere; }
  .profile .meta { color: var(--sub); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .profile .meta .bar { width: 1px; height: 10px; background: var(--line); }
  .profile .date { color: var(--sub); font-size: 12px; margin-top: 8px; }
  .profile .acts { margin-top: auto; padding-top: 20px; display: grid; gap: 8px; }
  .profile .acts a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 20px; text-decoration: none; font-size: 13px; }
  .profile .acts a:hover { background: var(--bg); }
  .mail .mail-body { min-height: 120px; display: grid; place-items: center; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.6; padding: 10px 0 16px; }
  .mail .mail-ic { font-size: 30px; margin-bottom: 6px; }
  .apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .app { display: flex; gap: 16px; align-items: center; text-decoration: none; padding: 20px; }
  .app:hover { border-color: var(--accent); }
  .app .ico { flex: 0 0 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--accent); color: var(--accent-ink); }
  .app b { display: block; font-size: 16px; margin-bottom: 3px; }
  .app span { color: var(--sub); font-size: 13px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .daygroup { font-size: 12px; font-weight: 700; color: var(--sub); margin: 10px 0 2px; }
  .daygroup:first-child { margin-top: 0; }
  .links { display: grid; gap: 8px; }
  .links a { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }
  .links a:hover { background: var(--bg); }
  .links a::after { content: '↗'; color: var(--sub); font-weight: 400; }
  @media (max-width: 1180px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .home { grid-template-columns: minmax(0, 1fr); } .left { display: contents; } .profile { min-height: 0; order: 0; } .right { order: 1; } .linkcard { order: 2; } }
  @media (max-width: 720px) { .apps, .grid { grid-template-columns: minmax(0, 1fr); } .app { padding: 16px; } }
</style>
</head>
<body data-page="home">
  <main class="wrap home">
    <div class="left">
      <section class="card profile">
        <div class="avatar"><img src="logo.svg" alt=""></div>
        <h1 id="hello">안녕하세요.</h1>
        <div class="meta" id="meta"><span>스페이스베이스</span></div>
        <div class="date" id="today"></div>
        <div class="acts">
          <a href="schedule.html">▦ 주간 스케줄 열기</a>
          <a href="calendar.html">▣ 회사 캘린더 열기</a>
        </div>
      </section>
      <section class="card linkcard">
        <h2>바로가기</h2>
        <div class="links">
          <a href="https://www.band.us" id="bandHome" target="_blank" rel="noopener">네이버 밴드</a>
          <a href="https://www.spacebase.co.kr/ko" target="_blank" rel="noopener">스페이스베이스 홈페이지</a>
          <a href="https://www.spacebase.co.kr/ko/blog" target="_blank" rel="noopener">블로그</a>
          <a href="https://www.instagram.com/sbe_spacebase/" target="_blank" rel="noopener">인스타그램</a>
        </div>
      </section>
    </div>

    <div class="right">
      <div id="calWarn" class="warn hidden" style="margin-bottom:14px"></div>
      <div class="apps">
        <a class="card app" href="schedule.html">
          <div class="ico">▦</div>
          <div><b>주간 스케줄</b><span>프로젝트 진행 스케줄표. 여러 명이 동시에 고쳐도 바로 반영돼요.</span></div>
        </a>
        <a class="card app" href="calendar.html">
          <div class="ico">▣</div>
          <div><b>회사 캘린더</b><span>밴드 캘린더 일정과 직접 추가한 일정을 월·주·목록으로 봐요.</span></div>
        </a>
      </div>

      <div class="grid">
        <section class="card">
          <h2>오늘 일정 <a class="more hidden" id="bandAdd" target="_blank" rel="noopener">＋ 일정 추가</a><a class="more" href="calendar.html" id="calOpen">전체 ›</a></h2>
          <ul class="events" id="todayList"><li class="empty">불러오는 중…</li></ul>
        </section>
        <section class="card">
          <h2>다가오는 일정 (7일)</h2>
          <div id="weekList"><div class="empty">불러오는 중…</div></div>
        </section>
        <section class="card mail">
          <h2><a href="https://mail.worksmobile.com/" target="_blank" rel="noopener" style="text-decoration:none">메일 ›</a></h2>
          <div class="mail-body"><div><div class="mail-ic">✉</div>네이버웍스 메일은 아직 이 화면에 연결되지 않았어요.<br>아래 버튼으로 메일함을 바로 열 수 있어요.</div></div>
          <a class="btn primary" style="width:100%" href="https://mail.worksmobile.com/" target="_blank" rel="noopener">네이버웍스 메일 열기</a>
        </section>
      </div>
    </div>
  </main>

<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="ws-common.js"></script>
<script>
(async function () {
  const { esc, ymd, dayLabel, addDays, daysOf, whenText, data: ready, showEvent, bandMissingText } = WS;
  const today = ymd(new Date());
  document.getElementById('today').textContent = '🗓 ' + dayLabel(today).replace(')', '요일)');
  ready.then(async (d) => {
    if (!d.user) return;
    document.getElementById('hello').innerHTML = `${esc(d.user.name)}님,<br>안녕하세요.`;
    const p = await d.profile().catch(() => ({}));
    const bits = [p.rank, p.team, '스페이스베이스'].filter(Boolean);
    document.getElementById('meta').innerHTML = bits.map((b) => `<span>${esc(b)}</span>`).join('<span class="bar"></span>');
  }).catch(() => {});

  const item = (e, day) => `<li data-id="${esc(e.id)}"><span class="when">${whenText(e, day)}</span>
    <span class="what"><b><span class="dot ${e.source === 'web' ? 'web' : ''}"></span> ${esc(e.title)}</b>${e.location ? `<small>${esc(e.location)}</small>` : ''}</span></li>`;

  let data;
  try {
    data = await (await ready).events(`${today}T00:00:00+09:00`, `${addDays(today, 8)}T00:00:00+09:00`);
  } catch (e) {
    document.getElementById('todayList').innerHTML = `<li class="empty">일정을 불러오지 못했어요. (${esc(e.message)})</li>`;
    document.getElementById('weekList').innerHTML = '';
    return;
  }
  const byId = new Map(data.events.map((e) => [e.id, e]));
  const st = data.status, warn = document.getElementById('calWarn');
  // "네이버 밴드" 바로가기 → 회사 밴드 게시글 화면 (밴드 주소는 저장소가 아니라 Secret BAND_URL 에서 가져옴)
  const bandId = (String(st.bandUrl || '').match(/band\.us\/band\/(\d+)/) || [])[1];
  if (bandId) document.getElementById('bandHome').href = `https://www.band.us/band/${bandId}/post`;
  if (st.bandConnected && st.bandUrl) { const a = document.getElementById('bandAdd'); a.href = st.bandUrl; a.classList.remove('hidden'); document.getElementById('calOpen').style.marginLeft = '12px'; }
  if (!st.bandConnected) { warn.innerHTML = esc(bandMissingText(st)) + (st.configError ? `<br>(${esc(st.configError)})` : ''); warn.classList.remove('hidden'); }
  else if (st.error) { warn.textContent = st.error; warn.classList.remove('hidden'); }

  const on = (d) => data.events.filter((e) => daysOf(e).includes(d));
  const t = on(today);
  document.getElementById('todayList').innerHTML = t.length ? t.map((e) => item(e, today)).join('') : '<li class="empty">오늘은 일정이 없어요.</li>';
  let html = '';
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today, i), list = on(d);
    if (list.length) html += `<div class="daygroup">${dayLabel(d)}</div><ul class="events">${list.map((e) => item(e, d)).join('')}</ul>`;
  }
  document.getElementById('weekList').innerHTML = html || '<div class="empty">앞으로 7일 동안 일정이 없어요.</div>';
  document.querySelector('main').addEventListener('click', (ev) => {
    const li = ev.target.closest('li[data-id]');
    if (li && byId.has(li.dataset.id)) showEvent(byId.get(li.dataset.id));
  });
})();
</script>
</body>
</html>
