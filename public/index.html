<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 스케줄</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="toolbar">
    <a href="/" id="homeLink" class="homelink hidden" title="워크스페이스 홈으로">⌂ 홈</a>
    <div class="brand" id="title">SPACEBASE SCHEDULE</div>
    <div class="weeknav">
      <button id="prevWeek" title="이전 주">◀</button>
      <button id="thisWeek">이번 주</button>
      <button id="nextWeek" title="다음 주">▶</button>
      <span class="weeklabel" id="weekLabel"></span>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status">연결 중…</div>
    <div class="people" id="people"></div>
    <div class="menu">
      <button id="printBtn" title="인쇄">인쇄</button>
      <a href="/api/export.json" id="backupLink" title="전체 데이터를 파일로 받기">백업</a>
      <span class="me" id="me"></span>
      <a href="/logout" id="logoutLink">로그아웃</a>
    </div>
  </header>

  <main class="page">
    <div class="sheet-wrap" id="sheetWrap">
      <div class="row-tools" id="rowTools">
        <button data-act="addBelow" title="아래에 행 추가">＋</button>
        <button data-act="up" title="위로 이동">▲</button>
        <button data-act="down" title="아래로 이동">▼</button>
        <button data-act="del" title="행 삭제" class="danger">✕</button>
      </div>
      <div class="sheet-title" id="sheetTitle"><div class="t1">SPACEBASE SCHEDULE</div><div class="t2">(PROJECT PROGRESS SCHEDULE)</div></div>
      <table class="sheet" id="sheet"></table>
      <div class="thisweek-box" id="thisWeekBox"></div>
      <div class="add-group"><button id="addGroupBtn">＋ 구분 추가</button></div>
    </div>

    <section class="memo">
      <div class="memo-title">□MEMO</div>
      <div class="memo-cols">
        <textarea id="memoLeft" data-memo="left" spellcheck="false"></textarea>
        <textarea id="memoRight" data-memo="right" spellcheck="false"></textarea>
      </div>
      <textarea id="memoNotice" class="memo-notice" data-memo="notice" spellcheck="false" placeholder="■ 공지사항"></textarea>
    </section>

    <section class="etc-memo">
      <div class="memo-title">□기타 메모</div>
      <textarea id="memoEtc" data-memo="etc" spellcheck="false" placeholder="자유롭게 적어 주세요. 모든 사람에게 바로 공유됩니다."></textarea>
    </section>

    <section class="bottom">
      <div class="members">
        <div class="members-head"><span class="memo-title">■ 구성원</span><button id="ranksBtn" class="link tool">직급 목록 편집</button><button id="mteamAddBtn" class="link tool">＋ 팀 추가</button></div>
        <div class="ranks-edit hidden" id="ranksEdit">
          <span>직급 목록 (쉼표로 구분, 적은 순서대로 보여요)</span>
          <input id="ranksInput" autocomplete="off">
          <button id="ranksSave">저장</button><button id="ranksCancel" class="link">취소</button>
        </div>
        <div class="mteams" id="mteams"></div>
      </div>
    </section>
    <footer class="page-foot" id="pageFoot"><span>SPACEBASE SCHEDULE</span><span>스페이스베이스</span></footer>
  </main>

  <!-- 칸 편집 팝업 -->
  <div class="pop hidden" id="pop">
    <div class="pop-head"><span id="popTitle"></span><button class="x" id="popClose">✕</button></div>
    <input id="popText" placeholder="일정 입력 후 Enter" maxlength="200" autocomplete="off">
    <div class="pop-label">카테고리</div>
    <div class="chips" id="popChips"></div>
    <div class="pop-foot">
      <button id="popClear" class="link danger">칸 지우기</button>
      <span class="hint">Enter 저장 · Esc 닫기</span>
    </div>
  </div>

  <div class="ctx hidden" id="ctx"></div>
  <div class="toast hidden" id="toast"></div>

  <!-- 처음 한 번: 회사 비밀번호 + 이름 -->
  <div class="gate hidden" id="gate">
    <form class="gate-card" id="gateForm" autocomplete="off">
      <h1>SPACEBASE SCHEDULE</h1>
      <p>처음 한 번만 입력하면 다음부터는 바로 열려요.</p>
      <input id="gateCode" type="password" placeholder="회사 비밀번호">
      <input id="gateName" type="text" placeholder="이름 (예: 홍길동)" maxlength="20">
      <div class="gate-err" id="gateErr"></div>
      <button>시작하기</button>
      <a href="/" class="gate-home hidden" id="gateHome">← 워크스페이스 홈으로</a>
    </form>
  </div>

  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="default-data.js"></script>
  <script src="holidays.js"></script>
  <script src="ops.js"></script>
  <script src="app.js"></script>
  <script>if (/^https?:$/.test(location.protocol)) { document.getElementById('homeLink').classList.remove('hidden'); document.getElementById('gateHome').classList.remove('hidden'); }</script>
</body>
</html>
